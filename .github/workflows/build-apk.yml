name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Hide API, Sitemap, and Delete Public Pages
        run: |
          mv app/api app/api_backup
          if [ -f app/sitemap.js ]; then mv app/sitemap.js app/sitemap.js_backup; fi
          if [ -f app/sitemap.ts ]; then mv app/sitemap.ts app/sitemap.ts_backup; fi
          
          # Physically delete public folders as you requested
          rm -rf "app/[slug]"
          rm -rf app/accept-beta
          rm -rf app/accept-invite
          rm -rf app/beta
          
      - name: Build Next.js
        run: BUILD_TARGET=mobile npm run build
        env:
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_KEY: 'placeholder-key'
          
      - name: Restore API and Sitemap
        run: |
          mv app/api_backup app/api
          if [ -f app/sitemap.js_backup ]; then mv app/sitemap.js_backup app/sitemap.js; fi
          if [ -f app/sitemap.ts_backup ]; then mv app/sitemap.ts_backup app/sitemap.ts; fi
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
