name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Hide API, Sitemap, and Delete Public Pages
        run: |
          mv app/api ./api_backup
          rm -f app/sitemap.js app/sitemap.ts
          rm -rf app/track app/accept-beta app/accept-invite app/beta app/verify-email "app/[slug]"
          rm -rf app/debug-business app/faq app/fashion app/forgot-password app/learn app/onboarding
          rm -rf app/payments-setup app/pricing app/printing app/repairs app/reset-password app/support app/welcome
          
      - name: Build Next.js
        run: BUILD_TARGET=mobile npm run build
        env:
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_KEY: 'placeholder-key'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
