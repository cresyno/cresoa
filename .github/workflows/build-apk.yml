name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Strictly keep only Dashboard, Login, and Signup
        run: |
          # Move API completely outside the app folder
          mv app/api ./api_backup
          
          # Delete sitemaps
          rm -f app/sitemap.js app/sitemap.ts
          
          # Go into app folder and delete ALL directories EXCEPT dashboard, login, signup
          cd app
          find . -maxdepth 1 -type d ! -name "." ! -name "dashboard" ! -name "login" ! -name "signup" -exec rm -rf {} +
          cd ..
          
      - name: Build Next.js
        run: BUILD_TARGET=mobile npm run build
        env:
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_KEY: 'placeholder-key'
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
