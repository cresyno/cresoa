name: Build Next.js Static Export
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: BUILD_TARGET=mobile npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-static-files
          path: out/